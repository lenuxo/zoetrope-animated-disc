<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      try {
        const theme = localStorage.getItem('zoetrope-theme');
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch { document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches); }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zoetrope 旋转动画唱片的纯前端实验项目。" />
    <title>Zoetrope · 唱片实验室</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
